# Blueprint do Render: um web service Docker com disco persistente para os bancos SQLite.
services:
  - type: web
    name: nexo-assist
    runtime: docker
    plan: starter
    healthCheckPath: /login
    disk:
      name: nexo-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TICKETS_SERVICE_KEY
        generateValue: true
      - key: NEXO_MODEL
        value: claude-opus-5-5
      - key: NEXO_EFFORT
        value: low
      - key: NEXO_DAILY_TURN_LIMIT
        value: "60"
      - key: TICKETS_FAILURE_RATE
        value: "0.1"
